name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'europe-central2' }}
  REPO: ${{ vars.ARTIFACT_REPO || 'silpo-agent-backend' }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'silpo-agent-backend' }}

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Ensure Artifact Registry repo exists
        run: |
          gcloud artifacts repositories describe "$REPO" \
            --location="$REGION" --project="$PROJECT_ID" >/dev/null 2>&1 || \
          gcloud artifacts repositories create "$REPO" \
            --repository-format=docker \
            --location="$REGION" \
            --project="$PROJECT_ID" \
            --description="silpo-agent-backend images"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORE_SERVICE_TOKEN: ${{ secrets.CORE_SERVICE_TOKEN }}
          CORE_AGENT_URL: ${{ vars.CORE_AGENT_URL }}
          SILPO_REFRESH_URL: ${{ vars.SILPO_REFRESH_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is empty - the service cannot start without it"
            exit 1
          fi

          trap 'rm -f /tmp/env-vars.yaml' EXIT

          # Env vars go through a file rather than --set-env-vars: a Postgres
          # URL contains '@', ':' and '/', which break gcloud's delimiter
          # syntax (a '^@^' delimiter silently truncates the URL at the
          # password). JSON is valid YAML, and jq escapes every value.
          # Secrets arrive via the step env, so they are never interpolated
          # into the script text.
          jq -n \
            --arg database_url "$DATABASE_URL" \
            --arg jwt_secret "$JWT_SECRET" \
            --arg core_service_token "$CORE_SERVICE_TOKEN" \
            --arg core_agent_url "$CORE_AGENT_URL" \
            --arg silpo_refresh_url "$SILPO_REFRESH_URL" \
            '{
              DATABASE_URL: $database_url,
              JWT_SECRET: $jwt_secret,
              CORE_SERVICE_TOKEN: $core_service_token,
              CORE_AGENT_URL: $core_agent_url,
              SILPO_REFRESH_URL: $silpo_refresh_url
            }' > /tmp/env-vars.yaml

          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:${GITHUB_SHA}" \
            --platform=managed \
            --allow-unauthenticated \
            --timeout=600 \
            --env-vars-file=/tmp/env-vars.yaml \
            --quiet

      - name: Dump Cloud Run logs on failure
        if: failure()
        run: |
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=$SERVICE" \
            --project="$PROJECT_ID" \
            --limit=50 \
            --format='value(timestamp,textPayload)' || true
